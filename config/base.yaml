app:
  name: "SISE"
  env: "local"

paths:
  lake_root: "./data"
  bronze: "./data/bronze"
  silver: "./data/silver"
  gold: "./data/gold"

sources:
  sec:
    user_agent: "SISE-PortfolioProject/1.0 (contact: your_email@example.com)"
    submissions_url: "https://data.sec.gov/submissions/CIK{cik_padded}.json"
  fred:
    api_key_env: "FRED_API_KEY"
    base_url: "https://api.stlouisfed.org/fred"
  gdelt:
    doc_api: "https://api.gdeltproject.org/api/v2/doc/doc"
    events_api: "https://api.gdeltproject.org/api/v2/events/events"

model:
  esg_risk:
    horizon_days: 30
    severe_threshold: 80
    high_threshold: 65
    moderate_threshold: 45
  factor_timing:
    horizon_days: 30
    min_signal_z: 1.0

logging:
  level: "INFO"